<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Panel Connection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0f2027 0%, #203a43 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #4cc9f0;
            font-size: 2.5em;
            text-shadow: 0 2px 10px rgba(76, 201, 240, 0.3);
        }
        
        .test-section {
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        h2 {
            color: #4cc9f0;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        h2 i {
            font-size: 1.2em;
        }
        
        .url-list {
            display: grid;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .url-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        
        .url-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }
        
        .url-text {
            flex: 1;
            font-family: monospace;
            word-break: break-all;
            color: #fff;
        }
        
        .test-btn {
            background: #4361ee;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .test-btn:hover {
            background: #3a56d4;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(67, 97, 238, 0.4);
        }
        
        .test-btn.testing {
            background: #f9c74f;
        }
        
        .test-btn.success {
            background: #00d4aa;
        }
        
        .test-btn.error {
            background: #ff6b6b;
        }
        
        .result {
            margin-top: 15px;
            padding: 15px;
            border-radius: 10px;
            display: none;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .result.success {
            display: block;
            background: rgba(0, 212, 170, 0.2);
            border: 1px solid rgba(0, 212, 170, 0.3);
            color: #00d4aa;
        }
        
        .result.error {
            display: block;
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid rgba(255, 107, 107, 0.3);
            color: #ff6b6b;
        }
        
        .result-content {
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 200px;
            overflow-y: auto;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            margin-top: 10px;
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .status i {
            font-size: 1.2em;
        }
        
        .quick-test {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }
        
        .quick-btn {
            background: linear-gradient(135deg, #4cc9f0 0%, #4361ee 100%);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1.1em;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        
        .quick-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(76, 201, 240, 0.3);
        }
        
        .quick-btn i {
            font-size: 1.5em;
        }
        
        .summary {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            text-align: center;
        }
        
        .summary h3 {
            color: #4cc9f0;
            margin-bottom: 15px;
        }
        
        .summary-stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 15px;
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .success-value {
            color: #00d4aa;
        }
        
        .error-value {
            color: #ff6b6b;
        }
        
        .pending-value {
            color: #f9c74f;
        }
        
        .copy-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            margin-left: 10px;
            transition: all 0.3s ease;
        }
        
        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .quick-test {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-plug"></i> Panel Connection Tester</h1>
        
        <div class="test-section">
            <h2><i class="fas fa-server"></i> Test Server URLs</h2>
            <p style="margin-bottom: 15px; color: rgba(255,255,255,0.8);">Test these URLs to find which one works:</p>
            
            <div class="url-list">
                <!-- URLs will be added by JavaScript -->
            </div>
        </div>
        
        <div class="test-section">
            <h2><i class="fas fa-code"></i> Test API Endpoints</h2>
            <div class="quick-test">
                <button class="quick-btn" onclick="testEndpoint('/')">
                    <i class="fas fa-home"></i>
                    Root Endpoint
                </button>
                <button class="quick-btn" onclick="testEndpoint('/sessions')">
                    <i class="fas fa-list"></i>
                    /sessions
                </button>
                <button class="quick-btn" onclick="testEndpoint('/api/sessions')">
                    <i class="fas fa-list-alt"></i>
                    /api/sessions
                </button>
                <button class="quick-btn" onclick="testPair('5511999999999')">
                    <i class="fas fa-key"></i>
                    Test Pairing
                </button>
            </div>
        </div>
        
        <div id="testResults">
            <!-- Results will appear here -->
        </div>
        
        <div class="summary">
            <h3>Test Summary</h3>
            <div class="summary-stats">
                <div class="stat">
                    <div class="stat-value success-value" id="successCount">0</div>
                    <div>Success</div>
                </div>
                <div class="stat">
                    <div class="stat-value error-value" id="errorCount">0</div>
                    <div>Failed</div>
                </div>
                <div class="stat">
                    <div class="stat-value pending-value" id="pendingCount">0</div>
                    <div>Pending</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // URLs to test
        const testUrls = [
            // HTTPS with different ports
            'https://fayzzinfinity-feellz.cloudprivate.web.id:3137',
            'https://fayzzinfinity-feellz.cloudprivate.web.id:3000',
            'https://fayzzinfinity-feellz.cloudprivate.web.id:443',
            'https://fayzzinfinity-feellz.cloudprivate.web.id:80',
            
            // HTTP with different ports
            'http://fayzzinfinity-feellz.cloudprivate.web.id:3137',
            'http://fayzzinfinity-feellz.cloudprivate.web.id:3000',
            'http://fayzzinfinity-feellz.cloudprivate.web.id:80',
            
            // Without port (default)
            'https://fayzzinfinity-feellz.cloudprivate.web.id',
            'http://fayzzinfinity-feellz.cloudprivate.web.id',
            
            // With API path
            'https://fayzzinfinity-feellz.cloudprivate.web.id:3137/api',
            'http://fayzzinfinity-feellz.cloudprivate.web.id:3137/api',
        ];

        // Stats
        let stats = {
            success: 0,
            error: 0,
            pending: 0
        };

        // Initialize the URL list
        function initUrlList() {
            const urlList = document.querySelector('.url-list');
            urlList.innerHTML = '';
            
            testUrls.forEach(url => {
                const urlItem = document.createElement('div');
                urlItem.className = 'url-item';
                urlItem.innerHTML = `
                    <span class="url-text">${url}</span>
                    <button class="test-btn" onclick="testUrl('${url}')" data-url="${url}">
                        <i class="fas fa-play"></i>
                        Test
                    </button>
                `;
                urlList.appendChild(urlItem);
            });
            
            updateStats();
        }

        // Test a specific URL
        async function testUrl(url) {
            const button = document.querySelector(`[data-url="${url}"]`);
            const originalHtml = button.innerHTML;
            
            // Update button state
            button.className = 'test-btn testing';
            button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Testing...';
            button.disabled = true;
            
            stats.pending++;
            updateStats();
            
            try {
                // Test the URL
                const response = await fetch(url, {
                    method: 'GET',
                    mode: 'cors',
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                
                const status = response.status;
                let data;
                
                try {
                    data = await response.json();
                } catch {
                    data = await response.text();
                }
                
                // Show success
                button.className = 'test-btn success';
                button.innerHTML = '<i class="fas fa-check"></i> Success';
                
                stats.pending--;
                stats.success++;
                updateStats();
                
                // Show detailed result
                showResult('success', url, {
                    status: status,
                    data: data,
                    headers: Object.fromEntries(response.headers.entries())
                });
                
            } catch (error) {
                // Show error
                button.className = 'test-btn error';
                button.innerHTML = '<i class="fas fa-times"></i> Failed';
                
                stats.pending--;
                stats.error++;
                updateStats();
                
                // Show error details
                showResult('error', url, {
                    error: error.message,
                    type: error.name
                });
            }
            
            // Re-enable button after 2 seconds
            setTimeout(() => {
                button.disabled = false;
                button.innerHTML = originalHtml;
                button.className = 'test-btn';
            }, 2000);
        }

        // Test a specific endpoint
        async function testEndpoint(endpoint) {
            const baseUrls = [
                'http://fayzzinfinity-feellz.cloudprivate.web.id:3137',
                'https://fayzzinfinity-feellz.cloudprivate.web.id:3137',
                'http://fayzzinfinity-feellz.cloudprivate.web.id',
                'https://fayzzinfinity-feellz.cloudprivate.web.id'
            ];
            
            for (const baseUrl of baseUrls) {
                const url = `${baseUrl}${endpoint}`;
                console.log(`Testing: ${url}`);
                
                try {
                    const response = await fetch(url, {
                        method: 'GET',
                        mode: 'cors',
                        headers: {
                            'Accept': 'application/json'
                        }
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        showResult('success', url, {
                            status: response.status,
                            data: data,
                            workingUrl: baseUrl
                        });
                        return;
                    }
                } catch (error) {
                    continue;
                }
            }
            
            showResult('error', endpoint, {
                error: 'All URL variations failed'
            });
        }

        // Test pairing endpoint
        async function testPair(phoneNumber) {
            const testNumber = phoneNumber || '5511999999999';
            const baseUrls = [
                'http://fayzzinfinity-feellz.cloudprivate.web.id:3137',
                'https://fayzzinfinity-feellz.cloudprivate.web.id:3137'
            ];
            
            const endpoints = ['/pair', '/api/pair', '/whatsapp/pair'];
            
            for (const baseUrl of baseUrls) {
                for (const endpoint of endpoints) {
                    const url = `${baseUrl}${endpoint}/${testNumber}`;
                    console.log(`Testing pair: ${url}`);
                    
                    try {
                        const response = await fetch(url, {
                            method: 'GET',
                            mode: 'cors',
                            headers: {
                                'Accept': 'application/json'
                            }
                        });
                        
                        const data = await response.json();
                        
                        showResult('success', url, {
                            status: response.status,
                            data: data,
                            workingEndpoint: endpoint,
                            workingUrl: baseUrl
                        });
                        return;
                        
                    } catch (error) {
                        continue;
                    }
                }
            }
            
            showResult('error', 'Pairing Test', {
                error: 'No working pairing endpoint found'
            });
        }

        // Show test result
        function showResult(type, url, data) {
            const resultsDiv = document.getElementById('testResults');
            const resultId = 'result-' + Date.now();
            
            const resultDiv = document.createElement('div');
            resultDiv.className = `result ${type}`;
            resultDiv.id = resultId;
            
            let content = '';
            if (type === 'success') {
                content = `
                    <div class="status">
                        <i class="fas fa-check-circle"></i>
                        <span>SUCCESS: ${url}</span>
                        <button class="copy-btn" onclick="copyToClipboard('${url}')">
                            <i class="fas fa-copy"></i> Copy URL
                        </button>
                    </div>
                    <div class="result-content">${JSON.stringify(data, null, 2)}</div>
                `;
            } else {
                content = `
                    <div class="status">
                        <i class="fas fa-exclamation-circle"></i>
                        <span>ERROR: ${url}</span>
                    </div>
                    <div class="result-content">${JSON.stringify(data, null, 2)}</div>
                `;
            }
            
            resultDiv.innerHTML = content;
            resultsDiv.prepend(resultDiv);
            
            // Auto-remove after 30 seconds
            setTimeout(() => {
                const elem = document.getElementById(resultId);
                if (elem) {
                    elem.style.opacity = '0';
                    elem.style.transform = 'translateY(-10px)';
                    setTimeout(() => elem.remove(), 300);
                }
            }, 30000);
        }

        // Update stats display
        function updateStats() {
            document.getElementById('successCount').textContent = stats.success;
            document.getElementById('errorCount').textContent = stats.error;
            document.getElementById('pendingCount').textContent = stats.pending;
        }

        // Copy URL to clipboard
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text)
                .then(() => {
                    alert('URL copied to clipboard!');
                })
                .catch(() => {
                    alert('Failed to copy URL');
                });
        }

        // Run all tests
        function runAllTests() {
            testUrls.forEach(url => {
                setTimeout(() => testUrl(url), Math.random() * 1000);
            });
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', () => {
            initUrlList();
            
            // Auto-test the most likely URL first
            setTimeout(() => {
                testUrl('http://fayzzinfinity-feellz.cloudprivate.web.id:3137');
            }, 1000);
        });
    </script>
</body>
</html>
